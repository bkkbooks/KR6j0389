body:
  text: 大興善寺三藏沙門大廣智不空奉詔譯爾時菩薩白佛言我有大神力極祕密陀羅尼為度脫當來末法雜染世界眾生欲說是神呪佛聽許爾時佛世尊讚菩薩言善哉善哉汝諸佛聽許諸菩薩諸天皆悉以隨喜速疾可說即菩薩從座而起合掌低頭踊躍歡喜右遶佛三迊退坐一面佛前即說大神呪曰曩莫三曼駄沒駄喃迦嚩日羅二合縛多曩吽篤𧁢訖哩二合婆呵爾時說妙真言已三千大千世界六種震動天雨曼荼羅華地涌出七寶一切眾生獲得悉地財綿錦繡金寶種如山岳世間甚以為希有若有在家出家善男善女受持是妙真言之中一字及我名一經於耳消滅生生世世極貧窮果報速疾世間出世間榮華樂具滿足成就供養三寶及六親九族乃至一切乞匃給施莫不如意若欲受持此法先畵菩薩像其形六臂又二腎色紅蓮華白馬為座圍遶六大使者菩薩畫已從師傳授真言先錦繡淨潔衣服乃至妻子眷屬所持財寶用施與師我即歡喜以一切寶施恩以七寶若是誓願不信為人不可令聞不可說假令受習修道不感應斯妙真言價直無央數佛功德若發信心供養恭敬瑜伽者如佛敬妙句受持之人得大功德如前所說若有國王大臣及諸小國王國土萬物枯盡五穀不豐登又蠶子不生錦繡財綿乏少時年中三箇月修行是法所謂三月三日五月五日九月九日種種妙華散種種餚饍飲食用供養五穀成就萬菓豐登國民皆悉天上人中所有樂具滿足其壇法量二肘半用牛糞塗種種名香和泥塗賢瓶四角置十方毗底羅香燒不燒是香不成就法所設供具用至其信心不喚菩薩自來至納受證誠令滿足施主所求願若有信男信女不論淨不淨日日晨朝時受持妙真言一百八遍并菩薩讚歎七遍稱誦不離身體世間諸事報示又官位福壽如意成就又印相說十指交絞右押左腕相離以印印五處由結印誦真言力故滅除無量罪報厭眉呪咀惡鬼羅剎亡靈魑魅之毒害一切灾難得無量福現世有無量快樂後生往生極樂子細次第可見又可受習符書大靈驗速疾術一校了奧書有康和天仁大治保延年號蠧損文字不分明故略之以高山寺藏本寫得畢文化甲子七月二十七日一校了慈順
